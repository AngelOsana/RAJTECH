<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaagapay - Social Protection Chatbot</title>
<style>
  :root { --page1:#b9c7dc; --page2:#dbe4f0; --panel:#1c2b40; --panel2:#17243a; --glass:rgba(255,255,255,.06); --line:rgba(125,211,200,.35);
          --text:#eaf1fb; --muted:#9fb1c8; --teal:#4fd1c5; --teal2:#2bb3b0; --blue1:#1d4ed8; --blue2:#1e40af; --user:rgba(255,255,255,.14); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif; color:var(--text); min-height:100vh; min-height:100dvh;
         background:#122036; display:flex; }
  button { font:inherit; cursor:pointer; color:inherit; }
  #app { width:100%; height:100vh; height:100dvh; display:flex; overflow:hidden;
         background:linear-gradient(160deg,#243955 0%,#16233a 55%,#122036 100%); }
  #side { width:290px; flex-shrink:0; padding:18px 16px; display:flex; flex-direction:column; gap:14px;
          background:linear-gradient(180deg,rgba(79,209,197,.18),rgba(79,209,197,.05)); border-right:1px solid rgba(255,255,255,.08); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.2px; padding:2px 4px; }
  .mark { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:var(--teal); background:rgba(79,209,197,.15); border:1px solid var(--line); }
  #newchat { padding:11px; border-radius:999px; border:1.5px solid var(--line); background:rgba(255,255,255,.07); font-weight:600; display:flex; gap:8px; justify-content:center; align-items:center; transition:.15s; }
  #newchat:hover { background:rgba(79,209,197,.22); }
  .label { font-size:11px; color:var(--muted); padding:0 6px; text-transform:uppercase; letter-spacing:.8px; }
  #list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; min-height:0; }
  .conv { display:flex; align-items:center; border-radius:10px; padding:9px 11px; cursor:pointer; gap:6px; font-size:14px; color:#d5e0ef; }
  .conv:hover { background:rgba(255,255,255,.08); }
  .conv.active { background:rgba(255,255,255,.16); color:#fff; }
  .conv span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .conv button { border:0; background:transparent; color:var(--muted); font-size:17px; padding:0 4px; visibility:hidden; }
  .conv:hover button { visibility:visible; }
  .info { border-radius:16px; padding:14px; background:var(--glass); border:1px solid rgba(255,255,255,.08); text-align:center; font-size:13px; color:var(--muted); line-height:1.45; }
  .info b { color:var(--text); display:block; margin-bottom:4px; font-size:14px; }
  .info .mark { margin:0 auto 8px; width:42px; height:42px; }
  .foot { border-top:1px solid rgba(255,255,255,.08); padding-top:8px; }
  #clearall { width:100%; text-align:left; border:0; background:transparent; padding:10px 8px; border-radius:10px; display:flex; gap:10px; align-items:center; font-size:14px; font-weight:600; }
  #clearall:hover { background:rgba(255,255,255,.08); }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; padding:18px 22px 20px; gap:10px; }
  #top { display:flex; align-items:center; gap:12px; }
  #menu { display:none; border:1px solid var(--line); background:var(--glass); border-radius:10px; padding:6px 11px; }
  #top .title { font-weight:600; display:flex; gap:8px; align-items:center; }
  #top .tag { margin-left:auto; font-size:13px; border:1.5px solid var(--line); border-radius:999px; padding:8px 16px; background:rgba(255,255,255,.06); font-weight:600; }
  #panel { flex:1; min-height:0; display:flex; flex-direction:column; border-radius:22px; border:1.5px solid rgba(255,255,255,.14); background:rgba(10,20,36,.28); overflow:hidden; }
  #msgs { flex:1; overflow-y:auto; padding:18px 22px; }
  .wrap { max-width:820px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  #today { text-align:center; font-size:11px; color:var(--muted); margin-bottom:-4px; }
  .msg { line-height:1.65; overflow-wrap:anywhere; font-size:15px; }
  .msg.user { align-self:flex-end; max-width:78%; padding:13px 18px; border-radius:18px 18px 4px 18px; background:var(--user); white-space:pre-wrap; }
  .msg.bot { max-width:88%; padding:16px 20px 16px 18px; border-radius:6px 18px 18px 18px; background:#e5e7eb; color:#1f2937; box-shadow:0 4px 14px rgba(0,0,0,.2); display:flex; flex-direction:column; gap:10px; }
  .avatar { width:32px; height:32px; border-radius:50%; background:#2bb3b0; color:#fff; display:grid; place-items:center; flex-shrink:0; }
  .body p { margin:0 0 8px; } .body p:last-child { margin:0; }
  .body a { color:#1d4ed8; } .body ul,.body ol { margin:4px 0 8px; padding-left:22px; }
  .body table { border-collapse:collapse; } .body td,.body th { border:1px solid rgba(0,0,0,.2); padding:4px 8px; }
  details.src { margin-top:10px; font-size:13px; color:#4b5563; border-top:1px solid rgba(0,0,0,.15); padding-top:8px; }
  details.src summary { cursor:pointer; }
  #empty { text-align:center; color:var(--muted); margin-top:9vh; }
  #empty h2 { color:var(--text); margin:8px 0 4px; }
  .bigmark { width:64px; height:64px; margin:0 auto; border-radius:20px; display:grid; place-items:center; color:var(--teal); background:rgba(79,209,197,.14); border:1px solid var(--line); }
  .bigmark svg { width:32px; height:32px; }
  .chip { display:inline-block; margin:5px; padding:9px 14px; border:1.5px solid var(--line); border-radius:999px; cursor:pointer; font-size:14px; color:var(--text); background:rgba(255,255,255,.06); }
  .chip:hover { background:rgba(79,209,197,.2); }
  #status { text-align:center; font-size:13px; color:var(--muted); min-height:18px; }
  #form { display:flex; align-items:center; gap:10px; margin:0 auto 4px; width:min(100%,860px); padding:8px 8px 8px 22px; border-radius:999px; border:1.5px solid var(--line); background:rgba(10,20,36,.45); }
  #input { flex:1; resize:none; border:0; outline:0; background:transparent; color:var(--text); font:inherit; max-height:120px; padding:8px 0; }
  #input::placeholder { color:var(--muted); }
  #send { width:46px; height:46px; border-radius:50%; border:0; background:linear-gradient(135deg,var(--teal),var(--teal2)); display:grid; place-items:center; color:#0c2a33; flex-shrink:0; }
  #send:disabled { opacity:.5; cursor:default; }
  ::-webkit-scrollbar { width:8px; } ::-webkit-scrollbar-thumb { background:rgba(255,255,255,.18); border-radius:8px; }
  @media (max-width: 760px) {
    #side { position:fixed; inset:0 auto 0 0; z-index:5; transform:translateX(-100%); transition:transform .2s; width:84%; max-width:310px; background:#1a2b44; }
    #side.open { transform:none; box-shadow:0 0 0 100vmax rgba(0,0,0,.45); }
    #menu { display:block; } #top .tag { display:none; } #main { padding:12px; } .msg.bot { max-width:96%; } #msgs { padding:14px 10px; }
  }
</style>
</head>
<body>
<div id="app">
<aside id="side">
  <div class="brand"><div class="mark"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.2 8.4-7 10-3.8-1.6-7-5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></div>Kaagapay</div>
  <button id="newchat"><span style="font-size:18px;line-height:1">+</span> New Chat</button>
  <div class="label">Recent Chats</div>
  <div id="list"></div>
  <div class="info"><b>Answers from 3 documents</b>Magna Carta of the Poor, 4Ps IRR (RA 11310) and the SP Operational Framework. For anything else, contact your local DSWD office.</div>
  <div class="foot"><button id="clearall"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Clear Conversations</button></div>
</aside>
<section id="main">
  <div id="top"><button id="menu" aria-label="Open chat history">&#9776;</button><div class="title">Social Protection Assistant</div><div class="tag">gpt-oss-120b · RAG</div></div>
  <div id="panel">
    <div id="msgs"><div class="wrap"><div id="today"></div><div class="wrap" id="chat"></div></div></div>
  </div>
  <div id="status"></div>
  <form id="form">
    <textarea id="input" rows="1" maxlength="500" placeholder="Ask about the Magna Carta of the Poor, 4Ps, or the SP Framework..."></textarea>
    <button id="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
  </form>
</section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script src="config.js"></script>
<script>
const API = (window.API_BASE || "").replace(/\/$/, "");
const $ = id => document.getElementById(id);
let clientId, convId = null, busy = false;
try { clientId = localStorage.getItem("kaagapay_client_id"); } catch (e) {}
if (!clientId) {
  clientId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(16).slice(2) + "-0000");
  try { localStorage.setItem("kaagapay_client_id", clientId); } catch (e) {}
}
const LOGO = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.2 8.4-7 10-3.8-1.6-7-5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>';
const EXAMPLES = ["Who shall promulgate the IRR of the Magna Carta of the Poor?", "How much is the monthly health and nutrition grant under 4Ps?", "Ano ang ibig sabihin ng progressive realization?"];

async function api(path, opts) {
  const timer = setTimeout(() => { $("status").textContent = "Waking up the server (the free host sleeps when idle) - this can take up to a minute..."; }, 6000);
  try {
    const r = await fetch(API + path, opts);
    if (!r.ok) { let d = {}; try { d = await r.json(); } catch (e) {} throw new Error(d.detail || r.statusText); }
    return await r.json();
  } finally { clearTimeout(timer); $("status").textContent = ""; }
}
function render(md) { return DOMPurify.sanitize(marked.parse(md || "")); }
function addMsg(role, text, sources) {
  const d = document.createElement("div"); d.className = "msg " + (role === "user" ? "user" : "bot");
  if (role === "user") d.textContent = text;
  else { const av = document.createElement("div"); av.className = "avatar"; av.innerHTML = LOGO; d.appendChild(av);
         const body = document.createElement("div"); body.className = "body"; body.innerHTML = render(text); d.appendChild(body); }
  if (sources && sources.length) {
    const s = document.createElement("details"); s.className = "src";
    const sm = document.createElement("summary"); sm.textContent = "Sources retrieved";
    s.appendChild(sm);
    sources.forEach(x => { const p = document.createElement("div"); p.textContent = x.source + ", p." + x.page + " (similarity " + x.similarity + ")"; s.appendChild(p); });
    (d.querySelector(".body") || d).appendChild(s);
  }
  $("chat").appendChild(d); $("msgs").scrollTop = $("msgs").scrollHeight; return d;
}
function showEmpty() {
  $("chat").innerHTML = "";
  const e = document.createElement("div"); e.id = "empty";
  e.innerHTML = '<div class="bigmark">' + LOGO + '</div><h2>Kaagapay</h2><p>Ask a question about the social protection documents.</p>';
  EXAMPLES.forEach(t => { const c = document.createElement("span"); c.className = "chip"; c.textContent = t; c.onclick = () => send(t); e.appendChild(c); });
  $("chat").appendChild(e);
}
async function loadList() {
  try {
    const rows = await api("/conversations?client_id=" + encodeURIComponent(clientId));
    $("list").innerHTML = "";
    rows.forEach(c => {
      const row = document.createElement("div"); row.className = "conv" + (c.id === convId ? " active" : "");
      const t = document.createElement("span"); t.textContent = c.title || "New chat";
      const x = document.createElement("button"); x.textContent = "×"; x.title = "Delete chat";
      x.onclick = async ev => { ev.stopPropagation(); await api("/conversations/" + c.id + "?client_id=" + encodeURIComponent(clientId), { method: "DELETE" }); if (c.id === convId) newChat(); loadList(); };
      row.onclick = () => openConv(c.id);
      row.append(t, x); $("list").appendChild(row);
    });
  } catch (e) { $("status").textContent = "Could not load chat history: " + e.message; }
}
async function openConv(id) {
  $("side").classList.remove("open");
  const msgs = await api("/conversations/" + id + "/messages?client_id=" + encodeURIComponent(clientId));
  convId = id; $("chat").innerHTML = "";
  msgs.forEach(m => addMsg(m.role, m.content, m.role === "assistant" ? m.sources : null));
  loadList();
}
function newChat() { convId = null; showEmpty(); $("side").classList.remove("open"); loadList(); }
async function send(text) {
  text = (text || $("input").value).trim(); if (!text || busy) return;
  busy = true; $("send").disabled = true; $("input").value = "";
  if ($("empty")) $("chat").innerHTML = "";
  addMsg("user", text);
  const wait = addMsg("bot", "Thinking...");
  try {
    const r = await api("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ client_id: clientId, message: text, conversation_id: convId }) });
    convId = r.conversation_id; wait.remove(); addMsg("bot", r.answer, r.sources); loadList();
  } catch (e) { wait.remove(); addMsg("bot", "Sorry, something went wrong: " + e.message); }
  busy = false; $("send").disabled = false; $("input").focus();
}
$("form").addEventListener("submit", e => { e.preventDefault(); send(); });
$("input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("newchat").onclick = newChat;
$("clearall").onclick = async () => {
  if (!confirm("Delete all your chats on this browser?")) return;
  try {
    const rows = await api("/conversations?client_id=" + encodeURIComponent(clientId));
    for (const c of rows) await api("/conversations/" + c.id + "?client_id=" + encodeURIComponent(clientId), { method: "DELETE" });
  } catch (e) { $("status").textContent = "Could not clear chats: " + e.message; }
  newChat();
};
$("menu").onclick = () => $("side").classList.toggle("open");
$("today").textContent = new Date().toISOString().slice(0, 10);
showEmpty(); loadList();
</script>
</body>
</html>
